<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f8fb" />

    <!--
      Горимыг React ачаалагдахААС ӨМНӨ буулгана.

      ⚠️ Энэ нь блоклодог скрипт байх ЁСТОЙ. `defer`, эсвэл React дотор
      хийвэл хэрэглэгч эхлээд буруу өнгө хараад дараа нь солигдоно.

      ── ЯАГААД ӨГӨГДМӨЛ НЬ ГЭРЭЛ ВЭ ──────────────────────────────

      Энэ бол зүгээр нэг зan сонголт биш, ЗУРГИЙН БИЗНЕСИЙН шаардлага.

      Хэрэглэгч оруулсан зургаа дэлгэц дээр хараад «ийм өнгөтэй хэвлэгдэнэ»
      гэж шийддэг. Харанхуй дэвсгэр дээр зураг илүү тод, илүү өнгөлөг
      харагддаг (нүдний харьцангуй мэдрэмж) — тэгээд цаасан дээр буухдаа
      бүдэг санагдана. Фото засварын програм, хэвлэлийн лаборатори бүр
      саарал эсвэл цагаан дэвсгэр хэрэглэдэг нь яг үүнээс.

      Тиймээс хадгалсан утга байхгүй бол ГЭРЭЛ горимыг албадана —
      үйлдлийн системийн харанхуй тохиргоог үл харгалзан.

      Харанхуй горимын бүх өнгө `index.css` дотор ХЭВЭЭР байгаа. Хожим
      сонголт болгож нээх бол `ThemeToggle`-ыг толгойд байрлуулахад л
      бүрэн ажиллана.
    -->
    <script>
      try {
        var t = localStorage.getItem('printmn-theme');
        document.documentElement.setAttribute(
          'data-theme',
          t === 'dark' || t === 'light' ? t : 'light',
        );
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>

    <!--
      Хадгалсан хэлийг мөн энд буулгана.

      React дотор хийвэл хайлтын систем болон дэлгэц уншигч эхлээд `lang="mn"`
      гэж уншаад, дараа нь өөрчлөгдөнө. Англи хэлтэй хэрэглэгчид дэлгэц уншигч
      эхний хормыг монгол дуудлагаар уншина.
    -->
    <script>
      try {
        var l = localStorage.getItem('printmn-lang');
        if (l === 'en' || l === 'mn') document.documentElement.lang = l;
      } catch (e) {}
    </script>
    <title>Printmn — Чанартай хэвлэл, хурдан үйлчилгээ</title>
    <meta
      name="description"
      content="Konica Minolta чанарын хэвлэл, зураг угаалт, цээж зураг, өргөмжлөл, медаль, фудболк хэвлэл. Улаанбаатар хотод 24 цагт хүргэнэ."
    />
    <meta property="og:title" content="Printmn — Чанартай хэвлэл, хурдан үйлчилгээ" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="mn_MN" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
